name: Coletar dados da Etsy

on:
  schedule:
    - cron: "*/10 11-23 * * *"   # 08:00 às 20:55 BRT (a cada 10 min)
    - cron: "*/10 0-2 * * *"     # 21:00 às 23:55 BRT
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor
        env:
          ETSY_API_KEY: ${{ secrets.ETSY_API_KEY }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
          ETSY_REFRESH_TOKEN: ${{ secrets.ETSY_REFRESH_TOKEN }}
          ETSY_SHOP_ID: ${{ secrets.ETSY_SHOP_ID }}
        run: python collector.py

      - name: Salvar histórico no repositório
        run: |
          git config user.name "coletor-etsy"
          git config user.email "coletor@magicmakers.local"
          git add historico.json
          git add data.json state.json 2>/dev/null || true
          git diff --quiet --cached || git commit -m "Atualiza histórico da loja"
          git push
